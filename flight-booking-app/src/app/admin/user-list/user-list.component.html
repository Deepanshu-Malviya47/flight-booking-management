<div class="user-list-container">
  <h3 *ngIf="roleFilter">Showing {{ roleFilter }}s</h3>
  <h3 *ngIf="!roleFilter">Showing All Users</h3>

  <table *ngIf="users.length > 0">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="errorMessage" class="error-box">{{ errorMessage }}</div>
</div>
